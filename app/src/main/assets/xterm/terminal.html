<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DevBox Terminal</title>
  <link rel="stylesheet" href="xterm.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: text;
      -webkit-user-select: text;
    }
    #terminal-container {
      width: 100%;
      height: 100%;
      padding: 4px;
      user-select: text;
      -webkit-user-select: text;
    }
    .xterm {
      padding: 2px;
      user-select: text;
      -webkit-user-select: text;
    }
    .xterm-viewport {
      background-color: #000000 !important;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script>
    let term;
    let fitAddon;

    function initTerminal() {
      term = new Terminal({
        theme: {
          background: '#000000',
          foreground: '#C9D1D9',
          cursor: '#58A6FF',
          cursorAccent: '#000000',
          selectionBackground: '#1F6FEB80',
          selectionForeground: '#FFFFFF',
          black: '#0D1117',
          red: '#FF7B72',
          green: '#3FB950',
          yellow: '#D29922',
          blue: '#58A6FF',
          magenta: '#BC8CFF',
          cyan: '#39C5CF',
          white: '#D1D5DA',
          brightBlack: '#484F58',
          brightRed: '#FFA198',
          brightGreen: '#56D364',
          brightYellow: '#E3B341',
          brightBlue: '#79C0FF',
          brightMagenta: '#D2A8FF',
          brightCyan: '#56D4DD',
          brightWhite: '#F0F6FC'
        },
        fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, monospace",
        fontSize: 13,
        lineHeight: 1.2,
        cursorBlink: true,
        cursorStyle: 'block',
        allowProposedApi: true,
        convertEol: true,
        scrollback: 5000
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      const container = document.getElementById('terminal-container');
      term.open(container);

      try {
        fitAddon.fit();
      } catch (e) {
        console.error("FitAddon error:", e);
      }

      term.onData(function (data) {
        if (window.DevBoxBridge && window.DevBoxBridge.sendInput) {
          window.DevBoxBridge.sendInput(data);
        }
      });

      term.onSelectionChange(function () {
        const selection = term.getSelection();
        if (window.DevBoxBridge && window.DevBoxBridge.onSelectionChanged) {
          window.DevBoxBridge.onSelectionChanged(selection || "");
        }
      });

      window.addEventListener('resize', function () {
        if (fitAddon) {
          fitAddon.fit();
          if (window.DevBoxBridge && window.DevBoxBridge.onTerminalResize) {
            window.DevBoxBridge.onTerminalResize(term.cols, term.rows);
          }
        }
      });

      if (window.DevBoxBridge && window.DevBoxBridge.onTerminalReady) {
        window.DevBoxBridge.onTerminalReady(term.cols, term.rows);
      }
    }

    function writeToTerminal(b64) {
      if (!term) return;
      try {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const decoded = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
        term.write(decoded);
      } catch (err) {
        try {
          term.write(atob(b64));
        } catch (e2) {
          console.error("Error writing b64 to terminal:", e2);
        }
      }
    }

    function clearTerminal() {
      if (term) term.clear();
    }

    function triggerFit() {
      if (fitAddon && term) {
        fitAddon.fit();
        if (window.DevBoxBridge && window.DevBoxBridge.onTerminalResize) {
          window.DevBoxBridge.onTerminalResize(term.cols, term.rows);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', initTerminal);
  </script>
</body>
</html>
