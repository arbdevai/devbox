name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'web/**'
      - 'docs/**'
      - 'screenshots/**'
      - 'screnshoot/**'
      - '*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK components
        uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          key: android-sdk-36-36.0.0

      - name: Accept Android SDK licenses & install components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" || true

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/signing/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/signing/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache --parallel --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check for Release
        id: check_release
        run: |
          if [[ "${{ github.event.head_commit.message }}" == Release\ v* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            TAG=$(echo "${{ github.event.head_commit.message }}" | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+' | head -n 1)
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        if: steps.check_release.outputs.is_release == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO_NAME: ${{ github.repository }}
          TAG_NAME: ${{ steps.check_release.outputs.tag }}
        run: |
          python3 -c '
          import os, re, subprocess

          commit_msg = os.environ.get("COMMIT_MSG", "").strip()
          repo = os.environ.get("REPO_NAME", "")
          tag = os.environ.get("TAG_NAME", "")

          lines = commit_msg.splitlines()
          title = lines[0] if lines else ""
          desc = re.sub(r"^Release\s+v[0-9.]+[:\s-]*", "", title).strip()
          body = "\n".join(lines[1:]).strip()

          out = ["## What\x27s Changed", ""]

          if body:
              out.append(body)
              out.append("")
          elif desc:
              # Pecah deskripsi 1-baris menjadi poin bullet jika dipisahkan koma atau "and"
              parts = re.split(r",\s*(?:and\s+)?|\s+and\s+", desc)
              bullets = [p.strip() for p in parts if p.strip()]
              if len(bullets) > 1:
                  for b in bullets:
                      out.append(f"- {b[0].upper() + b[1:]}")
              else:
                  out.append(f"- {desc}")
              out.append("")

          # Sertakan riwayat commit nyata sejak release tag sebelumnya jika ada
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD^"],
                  stderr=subprocess.DEVNULL
              ).decode().strip()
          except Exception:
              prev_tag = ""

          if prev_tag:
              try:
                  commits = subprocess.check_output(
                      ["git", "log", f"{prev_tag}..HEAD", "--oneline", "--no-merges"],
                      stderr=subprocess.DEVNULL
                  ).decode().strip()
                  filtered_commits = [
                      f"- {re.sub(r'^[a-f0-9]+\s+', '', c)}"
                      for c in commits.splitlines()
                      if not re.match(r"^[a-f0-9]+\s+Release\s+v", c, re.IGNORECASE)
                  ]
                  if filtered_commits:
                      out.append("### Commits")
                      out.extend(filtered_commits)
                      out.append("")
              except Exception:
                  pass

          out.append("---")
          out.append("### Download")
          out.append(f"- Release APK: [app-release.apk](https://github.com/{repo}/releases/download/{tag}/app-release.apk)")

          with open("release_notes.md", "w") as f:
              f.write("\n".join(out) + "\n")
          '

      - name: Publish tagged release
        if: steps.check_release.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.tag }}
          name: DevBox ${{ steps.check_release.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
